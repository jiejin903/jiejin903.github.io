<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF7F2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>我的工作台</title>
<!-- 本工作台通过 Supabase（REST / PostgREST，原生 fetch 调用，无 SDK）+ GitHub Pages 部署 -->
<style>
:root{
  --bg:#FAF7F2; --card:#FFFFFF; --text:#3D3730; --sub:#8A8078; --accent:#E8836B;
  --line:#EFE9E0; --line2:#F5F0E8; --green:#7BA88F; --blue:#8A9BB8; --red:#D9614C;
  --gold:#C9A961; --r:14px; --r-lg:16px;
  --sh:0 2px 10px rgba(61,55,48,.06); --sh2:0 6px 24px rgba(61,55,48,.10);
  --serif:"Noto Serif SC","Songti SC","Source Han Serif SC",Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Helvetica Neue",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text)}
body{font-family:var(--serif);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}
.num{font-family:var(--sans);font-variant-numeric:tabular-nums}

/* ---------- 布局 ---------- */
#app{display:flex;min-height:100vh}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:208px;background:#F6F2EB;border-right:1px solid var(--line);
  padding:20px 12px;display:flex;flex-direction:column;gap:2px;z-index:20;overflow-y:auto}
.sb-logo{padding:6px 10px 18px;font-size:17px;font-weight:600;letter-spacing:.5px}
.sb-logo span{display:block;font-size:11px;color:var(--sub);font-weight:400;letter-spacing:0;margin-top:2px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;color:var(--sub);
  font-size:14.5px;transition:.15s;width:100%;text-align:left}
.nav-item:hover{background:#EDE7DD;color:var(--text)}
.nav-item.on{background:var(--accent);color:#fff}
.nav-item.on svg{stroke:#fff}
.nav-item svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8}
.sb-foot{margin-top:auto;padding:10px;font-size:11.5px;color:var(--sub);line-height:1.5}

.main{margin-left:208px;flex:1;padding:22px 26px 60px;max-width:960px}
.tabbar{display:none}
.fab{display:flex;position:fixed;right:22px;bottom:26px;width:54px;height:54px;border-radius:50%;
  background:var(--accent);color:#fff;align-items:center;justify-content:center;
  box-shadow:0 6px 18px rgba(232,131,107,.42);z-index:29}
.fab svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:2.2}

@media (max-width:767px){
  .sidebar{display:none}
  .main{margin-left:0;padding:calc(10px + env(safe-area-inset-top)) 12px 92px;max-width:100%}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);
    backdrop-filter:blur(8px);border-top:1px solid var(--line);z-index:30;
    padding-bottom:env(safe-area-inset-bottom)}
  .tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 6px;
    color:var(--sub);font-size:11px;min-height:52px;justify-content:center}
  .tabbar button.on{color:var(--accent)}
  .tabbar svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}
  .fab{right:16px;bottom:calc(70px + env(safe-area-inset-bottom))}
  .mhead{position:sticky;top:0;background:var(--bg);z-index:15}
}

/* ---------- 通用 ---------- */
.page-title{font-size:22px;font-weight:600;letter-spacing:.5px}
.page-sub{font-size:13px;color:var(--sub);margin-top:2px}
.mhead{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;box-shadow:var(--sh);margin-bottom:14px}
.card-t{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.card-t h3{font-size:15.5px;font-weight:600;letter-spacing:.3px}
.muted{color:var(--sub);font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;
  border-radius:10px;background:#F3EDE4;color:var(--text);font-size:14px;border:1px solid transparent;transition:.15s}
.btn:hover{background:#EDE5D9}
.btn.pri{background:var(--accent);color:#fff}
.btn.pri:hover{background:#DE7458}
.btn.gh{background:transparent;border:1px solid var(--line);color:var(--sub)}
.btn.gh:hover{background:#F6F2EB;color:var(--text)}
.btn.sm{min-height:32px;padding:0 10px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--red)}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9}

.chip{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 12px;border-radius:15px;
  background:#F3EDE4;font-size:13px;color:var(--sub);white-space:nowrap}
.chip.on{background:var(--accent);color:#fff}
.chip.sm{height:26px;padding:0 10px;font-size:12px}

.pill{display:inline-block;padding:1px 8px;border-radius:8px;font-size:11.5px;font-family:var(--sans);
  background:#F3EDE4;color:var(--sub);white-space:nowrap}
.pill.high{background:#FBE6E0;color:#C0503C}
.pill.mid{background:#FBEEDC;color:#B07B36}
.pill.low{background:#E9EFE6;color:#5F8568}
.pill.ai{background:#E8EDF5;color:#5C6E8C}
.pill.psy{background:#EFE9F3;color:#7A628C}

input[type=text],input[type=date],input[type=number],input[type=password],select,textarea{
  width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
  background:#FFFDFB;font-size:16px;outline:none;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);background:#fff}
textarea{min-height:90px;resize:vertical;line-height:1.6}
label.f{display:block;font-size:13px;color:var(--sub);margin:0 0 5px 2px}
.fg{margin-bottom:12px}

.empty{text-align:center;padding:34px 16px;color:var(--sub)}
.empty svg{width:74px;height:74px;stroke:#E2D9CB;fill:none;stroke-width:1.4;margin-bottom:10px}
.empty p{font-size:13.5px;margin-bottom:14px}

.sk{background:linear-gradient(90deg,#F3EDE4 25%,#F8F4EE 37%,#F3EDE4 63%);
  background-size:400% 100%;animation:sk 1.3s ease infinite;border-radius:8px}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}

/* ---------- 首页 ---------- */
.hello{font-size:12.5px;color:var(--sub);letter-spacing:1px}
.date-big{font-size:26px;font-weight:600;letter-spacing:1px;margin:1px 0 2px}
.ringrow{display:flex;gap:14px;align-items:center;justify-content:space-around}
.hgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(min-width:768px){.hgrid{grid-template-columns:repeat(5,1fr)}}
.htile{aspect-ratio:1/1;border-radius:var(--r);border:1.5px solid var(--line);background:#FFFDFB;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  transition:.18s;padding:6px;position:relative;min-height:0}
.htile .hi{width:26px;height:26px;fill:none;stroke-width:1.8}
.htile .hn{font-size:12.5px;line-height:1.2;text-align:center}
.htile .hs{position:absolute;top:6px;right:7px;font-size:10px;color:var(--sub);font-family:var(--sans)}
.htile.on{color:#fff;border-color:transparent;box-shadow:0 3px 10px rgba(0,0,0,.10)}
.htile.on .hi{stroke:#fff}
.htile.on .hs{color:rgba(255,255,255,.85)}
.htile:not(.on) .hi{stroke:var(--sub)}

.titem{display:flex;align-items:flex-start;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line2)}
.titem:last-child{border-bottom:none}
.cbox{width:20px;height:20px;flex:none;border-radius:6px;border:1.6px solid #D9CFBF;margin-top:2px;
  display:flex;align-items:center;justify-content:center;transition:.15s;background:#fff}
.cbox svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:2.6;opacity:0}
.titem.done .cbox{background:var(--green);border-color:var(--green)}
.titem.done .cbox svg{opacity:1}
.titem.done .tt{text-decoration:line-through;color:var(--sub)}
.tt{font-size:14.5px;line-height:1.45;word-break:break-word}
.overdue{color:var(--red)}
.grp-t{font-size:12.5px;color:var(--sub);letter-spacing:.6px;margin:14px 0 2px;display:flex;
  align-items:center;justify-content:space-between}
.grp-t:first-child{margin-top:0}

.entries{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:768px){.entries{grid-template-columns:repeat(4,1fr)}}
.entry{background:#FFFDFB;border:1px solid var(--line);border-radius:var(--r);padding:13px 12px;
  display:flex;flex-direction:column;gap:7px;transition:.15s;text-align:left}
.entry:hover{border-color:var(--accent);background:#fff}
.entry .ei{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:#F3EDE4}
.entry .ei svg{width:15px;height:15px;stroke:var(--accent);fill:none;stroke-width:1.8}
.entry .en{font-size:13.5px;line-height:1.3}
.entry .ed{font-size:11.5px;color:var(--sub)}

/* ---------- 打卡 ---------- */
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.hcell{aspect-ratio:1/1;border-radius:4px;background:#F1EBE2}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.stat3 .v{font-size:22px;font-weight:600;font-family:var(--sans)}
.stat3 .k{font-size:11.5px;color:var(--sub)}

/* ---------- 列表卡片 ---------- */
.icard{background:#FFFDFB;border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;margin-bottom:10px}
.icard .ct{font-size:14.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tag{font-size:11.5px;font-family:var(--sans);padding:1px 8px;border-radius:8px;background:#F1EDE6;color:var(--sub)}
.icard img{max-width:100%;border-radius:10px;margin-top:9px;display:block}

.nitem{padding:12px 4px;border-bottom:1px solid var(--line2)}
.nitem:last-child{border-bottom:none}
.nitem .nt{font-size:14.5px;line-height:1.5;font-weight:500}
.nitem.read .nt{color:var(--sub);font-weight:400}

/* ---------- 表格 ---------- */
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-family:var(--sans);font-size:13px;min-width:420px}
th,td{text-align:right;padding:8px 6px;border-bottom:1px solid var(--line2);white-space:nowrap}
th{color:var(--sub);font-weight:500;font-size:12px}
th:first-child,td:first-child{text-align:left}
.mcards{display:none}
@media(max-width:520px){
  .tblwrap table{min-width:0}
  .tblwrap thead,.tblwrap tbody,.tblwrap tr{display:block}
  .tblwrap tr{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line2)}
  .tblwrap td{border:none;padding:0;display:flex;gap:6px;align-items:baseline}
  .tblwrap td::before{content:attr(data-l);font-size:11px;color:var(--sub)}
  .tblwrap td:first-child{width:100%;margin-bottom:4px}
}

/* ---------- 模态 ---------- */
.mask{position:fixed;inset:0;background:rgba(45,38,30,.42);z-index:100;display:flex;align-items:center;
  justify-content:center;padding:16px;animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:18px;width:100%;max-width:440px;max-height:88vh;overflow-y:auto;
  padding:20px;box-shadow:var(--sh2);animation:up .2s ease}
@keyframes up{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.modal h3{font-size:17px;margin-bottom:14px;font-weight:600}
.modal-f{display:flex;gap:10px;margin-top:16px}
.modal-f .btn{flex:1;min-height:44px}
@media(max-width:767px){
  .mask{align-items:flex-end;padding:0}
  .modal{max-width:100%;border-radius:18px 18px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom));
    max-height:92vh}
}

/* ---------- Toast / 提示条 ---------- */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom));
  z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:100%;padding:0 16px}
@media(min-width:768px){#toast{bottom:28px}}
.tst{background:rgba(61,55,48,.94);color:#fff;padding:9px 16px;border-radius:10px;font-size:13.5px;
  font-family:var(--sans);animation:up .2s ease;max-width:100%}
.tst.ok{background:var(--green)}
.tst.err{background:var(--accent)}
.bar{padding:8px 14px;border-radius:10px;font-size:13px;margin-bottom:12px;display:flex;
  align-items:center;justify-content:space-between;gap:10px;font-family:var(--sans)}
.bar.warn{background:#FBEEDC;color:#96692C}
.bar.err{background:#FBE6E0;color:#B04B36}
.bar.info{background:#EDF1F6;color:#4F6480}

/* ---------- 口令门 ---------- */
#gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;z-index:300}
.gbox{width:100%;max-width:340px;text-align:center}
.gbox h1{font-size:22px;font-weight:600;margin-bottom:4px}
.glogo{width:56px;height:56px;margin:0 auto 14px;border-radius:16px;background:var(--accent);
  display:flex;align-items:center;justify-content:center}
.glogo svg{width:28px;height:28px;stroke:#fff;fill:none;stroke-width:1.8}

/* ---------- 更多抽屉 ---------- */
.sheet-mask{position:fixed;inset:0;background:rgba(45,38,30,.4);z-index:80}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-radius:20px 20px 0 0;z-index:81;
  padding:16px 14px calc(20px + env(safe-area-inset-bottom));animation:up .2s ease}
.sheet h3{font-size:15px;color:var(--sub);margin-bottom:10px;font-weight:400}

.seg{display:flex;background:#F1EBE2;border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;min-height:32px;border-radius:8px;font-size:13px;color:var(--sub);font-family:var(--sans)}
.seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.06)}
</style>
</head>
<body>

<!-- ============ 口令门 ============ -->
<div id="gate">
  <div class="gbox">
    <div class="glogo"><svg viewBox="0 0 24 24"><path d="M3 12l9-8 9 8"/><path d="M5 10v10h14V10"/></svg></div>
    <h1>我的工作台</h1>
    <p class="muted" style="margin-bottom:18px">请输入进入口令</p>
    <input type="password" id="gateIn" placeholder="口令" autocomplete="off"
      style="text-align:center;margin-bottom:10px">
    <button class="btn pri" style="width:100%;min-height:46px" onclick="gateCheck()">进 入</button>
    <p class="muted" style="margin-top:14px;font-size:12px">首次默认口令 <b>lifehub2026</b><br>进入后可在「设置」中修改</p>
  </div>
</div>

<!-- ============ 主体 ============ -->
<div id="app" hidden>
  <aside class="sidebar">
    <div class="sb-logo">我的工作台<span id="sbToday"></span></div>
    <div id="navList"></div>
    <div class="sb-foot" id="sbFoot"></div>
  </aside>

  <main class="main">
    <div id="bars"></div>
    <div id="view"></div>
  </main>

  <button class="fab" data-act="quickadd" aria-label="新增">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <nav class="tabbar">
    <button data-act="nav" data-v="home"><svg viewBox="0 0 24 24"><path d="M3 12l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>首页</button>
    <button data-act="nav" data-v="tasks"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1.5 1.5L8 5"/></svg>工作</button>
    <button data-act="nav" data-v="inspirations"><svg viewBox="0 0 24 24"><path d="M9 18h6"/><path d="M12 3a6 6 0 0 0-3.5 10.9V16h7v-2.1A6 6 0 0 0 12 3z"/></svg>灵感</button>
    <button data-act="nav" data-v="more"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>更多</button>
  </nav>
</div>

<div id="modalRoot"></div>
<div id="toast"></div>

<script>
/* ==========================================================
   我的工作台 · 单文件应用
   数据层：Supabase REST（原生 fetch，无 SDK） + localStorage 镜像
   ========================================================== */
var LS = {
  get:function(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
var K={cfg:'wb_lh_cfg',db:'wb_lh_db',q:'wb_lh_q',pw:'wb_lh_pw',seed:'wb_lh_seed',view:'wb_lh_view',demo:'wb_lh_demo'};

// 默认已填好项目配置。anon/publishable key 本就是官方允许放前端的，安全边界靠 RLS + 网址不公开
var CFG = LS.get(K.cfg, {url:'https://xcsyowhmkumycyxhcgrw.supabase.co', key:'sb_publishable_1empui65jCXU9UweiMmwLg_e-UG_SBQ'});

var TABLES = {
  tasks:          {del:1, order:'created_at.asc'},
  habits:         {del:0, order:'sort_order.asc'},
  habit_logs:     {del:0, order:'date.desc'},
  inspirations:   {del:1, order:'created_at.desc'},
  news_items:     {del:0, order:'created_at.desc'},
  content_lines:  {del:0, order:'created_at.asc'},
  social_metrics: {del:0, order:'date.desc'},
  xhs_notes:      {del:1, order:'created_at.desc'},
  coffee_lessons: {del:0, order:'sort_order.asc'},
  coffee_brews:   {del:0, order:'date.desc'},
  cats:           {del:0, order:'created_at.asc'},
  cat_records:    {del:0, order:'date.desc'},
  books:          {del:0, order:'sort_order.asc'},
  book_quotes:    {del:0, order:'created_at.asc'},
  rss_sources:    {del:0, order:'id.asc', opt:1},
  rss_runs:       {del:0, order:'run_at.desc', opt:1}
};

var state = {
  view:'home', db:{}, q:[], online:navigator.onLine, syncing:false,
  lastSync:null, demo:false, ui:{}, confirmCb:null
};
Object.keys(TABLES).forEach(function(t){ state.db[t]=[]; });

/* ---------- 工具 ---------- */
function uid(){ try{return crypto.randomUUID()}catch(e){ return 'x'+Date.now().toString(16)+Math.random().toString(16).slice(2,10);} }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]}); }
function nl(s){ return esc(s).replace(/\n/g,'<br>'); }
function today(){ return fmt(new Date()); }
function fmt(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDays(s,n){ var d=new Date(s+'T00:00:00'); d.setDate(d.getDate()+n); return fmt(d); }
function diffD(a,b){ return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000); }
function cnDate(s){ if(!s)return''; var p=s.split('-'); return parseInt(p[1],10)+'月'+parseInt(p[2],10)+'日'; }
function wk(s){ return ['周日','周一','周二','周三','周四','周五','周六'][new Date(s+'T00:00:00').getDay()]; }
function num(n){ n=Number(n)||0; return n>=10000?(n/10000).toFixed(1)+'w':String(n); }
function ago(iso){
  if(!iso) return '';
  var t=new Date(iso).getTime(); if(isNaN(t))return '';
  var s=(Date.now()-t)/1000;
  if(s<60) return '刚刚';
  if(s<3600) return Math.floor(s/60)+' 分钟前';
  if(s<86400) return Math.floor(s/3600)+' 小时前';
  if(s<86400*7) return Math.floor(s/86400)+' 天前';
  return cnDate(iso.slice(0,10));
}
function toast(msg,type){
  var d=document.createElement('div');
  d.className='tst'+(type?' '+type:'');
  d.textContent=msg;
  document.getElementById('toast').appendChild(d);
  setTimeout(function(){ d.style.transition='.3s'; d.style.opacity='0'; setTimeout(function(){d.remove()},320); },1900);

/* ---------- Supabase ---------- */
function sbReady(){ return !!(CFG.url && CFG.key); }
function sb(path,opt){
  opt=opt||{};
  var h={'apikey':CFG.key,'Authorization':'Bearer '+CFG.key,'Content-Type':'application/json'};
  if(opt.prefer) h['Prefer']=opt.prefer;
  var url=CFG.url.replace(/\/$/,'')+'/rest/v1/'+path;
  var ctrl=new AbortController(); var to=setTimeout(function(){ctrl.abort()},15000);
  return fetch(url,{method:opt.method||'GET',headers:h,body:opt.body?JSON.stringify(opt.body):undefined,signal:ctrl.signal})
    .then(function(r){ clearTimeout(to); if(!r.ok) return r.text().then(function(t){throw new Error(r.status+' '+t.slice(0,120))}); 
      var txt=''; return r.text().then(function(t){txt=t; return txt?JSON.parse(txt):null;}); })
    .catch(function(e){ clearTimeout(to); throw e; });
}
function loadAll(){
  var names=Object.keys(TABLES);
  return Promise.all(names.map(function(t){
    var q='select=*&order='+encodeURIComponent(TABLES[t].order);
    if(TABLES[t].del) q+='&deleted_at=is.null';
    return sb(t+'?'+q).then(function(d){ state.db[t]=d||[]; return {t:t,ok:1}; })
      .catch(function(e){ if(TABLES[t].opt){ state.db[t]=[]; return {t:t,ok:0}; } throw e; });
  })).then(function(){ state.lastSync=Date.now(); state.demo=false; saveLocal(); });
}
function saveLocal(){ LS.set(K.db,state.db); LS.set(K.q,state.q); }

/* ---------- 离线队列 ---------- */
function push(op){ state.q.push(op); saveLocal(); renderBars(); flush(); }
function flush(){
  if(state.syncing || !sbReady() || !state.q.length) { renderBars(); return; }
  state.syncing=true; renderBars();
  var op=state.q[0];
  run(op).then(function(){
    state.q.shift(); state.syncing=false; saveLocal(); flush();
  }).catch(function(e){
    state.syncing=false;
    if(e && /^(4|5)/.test(e.message||'')){ // 服务端拒绝，丢弃避免死循环
      state.q.shift(); saveLocal(); toast('同步失败已跳过：'+op.t,'err');
    }
    saveLocal(); renderBars();
  });
}
function run(op){
  if(op.op==='insert') return sb(op.t,{method:'POST',body:op.row,prefer:'return=minimal'});
  if(op.op==='update') return sb(op.t+'?id=eq.'+op.id,{method:'PATCH',body:op.row,prefer:'return=minimal'});
  if(op.op==='softdel') return sb(op.t+'?id=eq.'+op.id,{method:'PATCH',body:{deleted_at:new Date().toISOString()},prefer:'return=minimal'});
  if(op.op==='delete') return sb(op.t+'?id=eq.'+op.id,{method:'DELETE',prefer:'return=minimal'});
  if(op.op==='restore') return sb(op.t+'?id=eq.'+op.id,{method:'PATCH',body:{deleted_at:null},prefer:'return=minimal'});
  return Promise.resolve();
}
function mut(op){
  saveLocal();
  if(sbReady()) push(op); else renderBars();
}
function addRow(t,row){ row.id=row.id||uid(); state.db[t].unshift(row); mut({t:t,op:'insert',row:row}); }
function updRow(t,id,patch){
  for(var i=0;i<state.db[t].length;i++){ if(state.db[t][i].id===id){ Object.assign(state.db[t][i],patch); break; } }
  mut({t:t,op:'update',id:id,row:patch});
}
function delRow(t,id){
  if(TABLES[t].del){
    // 软删除：保留行并打标记，30 天内可在「最近删除」恢复
    for(var j=0;j<state.db[t].length;j++){ if(state.db[t][j].id===id){ state.db[t][j].deleted_at=new Date().toISOString(); break; } }
  }else{
    for(var i=0;i<state.db[t].length;i++){ if(state.db[t][i].id===id){ state.db[t].splice(i,1); break; } }
  }
  mut({t:t,op:TABLES[t].del?'softdel':'delete',id:id});
}
function restoreRow(t,id){
  for(var i=0;i<state.db[t].length;i++){ if(state.db[t][i].id===id){ state.db[t][i].deleted_at=null; break; } }
  mut({t:t,op:'restore',id:id});
}

/* ================= 通用组件 ================= */
function ring(pct,label,color){
  color=color||'var(--accent)';
  var r=32,c=2*Math.PI*r,off=c*(1-Math.min(100,pct)/100);
  return `<svg viewBox="0 0 80 80" width="82" height="82">
    <circle cx="40" cy="40" r="${r}" fill="none" stroke="#F1EBE2" stroke-width="8"/>
    <circle cx="40" cy="40" r="${r}" fill="none" stroke="${color}" stroke-width="8" stroke-linecap="round"
      stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 40 40)"/>
    <text x="40" y="45" text-anchor="middle" font-size="19" font-family="-apple-system,sans-serif" fill="#3D3730">${pct}</text>
    <text x="40" y="59" text-anchor="middle" font-size="9" fill="#8A8078">%</text></svg>
    <div class="muted" style="text-align:center;margin-top:2px">${esc(label)}</div>`;
}
function lineChart(vals,labels,color,unit){
  var w=620,h=170,pl=38,pr=8,pt=12,pb=24;
  if(!vals.length) return '<div class="muted" style="padding:20px;text-align:center">暂无数据</div>';
  var max=Math.max.apply(null,vals.concat([1]));
  var n=vals.length;
  var pts=vals.map(function(v,i){
    var x=n===1?(pl+(w-pr-pl)/2):pl+i*(w-pr-pl)/(n-1);
    var y=pt+(h-pt-pb)*(1-(v||0)/max);
    return [x,y];
  });
  var d=pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1)}).join(' ');
  var area='M'+pts[0][0].toFixed(1)+','+(h-pb)+' L'+d.split(' ').join(' L')+' L'+pts[n-1][0].toFixed(1)+','+(h-pb)+' Z';
  var dots=pts.map(function(p,i){ return `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.6" fill="#fff" stroke="${color}" stroke-width="1.8"/>` }).join('');
  var gl='';
  [0,.5,1].forEach(function(f){
    var y=pt+(h-pt-pb)*(1-f);
    gl+=`<line x1="${pl}" y1="${y.toFixed(1)}" x2="${w-pr}" y2="${y.toFixed(1)}" stroke="#F1EBE2" stroke-width="1"/>
         <text x="${pl-6}" y="${(y+4).toFixed(1)}" text-anchor="end" font-size="10" fill="#8A8078">${num(Math.round(max*f))}</text>`;
  });
  var xl='';
  if(labels&&labels.length){
    [0,Math.floor((n-1)/2),n-1].forEach(function(i){
      xl+=`<text x="${pts[i][0].toFixed(1)}" y="${h-6}" text-anchor="${i===0?'start':(i===n-1?'end':'middle')}" font-size="10" fill="#8A8078">${esc(labels[i])}</text>`;
    });
  }
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" style="display:block">
    ${gl}<path d="${area}" fill="${color}" opacity=".08"/>
    <polyline points="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${dots}${xl}</svg>`;
}
function emptyBox(text,btn){
  return `<div class="empty">${ic('inbox')}<p>${esc(text)}</p>${btn?('<button class="btn pri" data-act="'+btn.act+'">'+esc(btn.label)+'</button>'):''}</div>`;
}
function head(title,sub,right){
  return `<div class="mhead"><div><div class="page-title">${esc(title)}</div>${sub?('<div class="page-sub">'+esc(sub)+'</div>'):''}</div>${right||''}</div>`;
}
function csv(rows,cols,name){
  var esc2=function(v){ v=String(v==null?'':v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  var s=cols.map(function(c){return esc2(c.k)}).join(',')+'\n';
  rows.forEach(function(r){ s+=cols.map(function(c){return esc2(c.v(r))}).join(',')+'\n'; });
  var b=new Blob(['\ufeff'+s],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name+'_'+today()+'.csv'; a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href)},2000);
  toast('已导出 CSV','ok');
}

/* ================= 打卡 ================= */
function streak(hid){
  var T=today(),n=0,i=0;
  if(!habitDone(hid,T)){ i=1; if(!habitDone(hid,addDays(T,-1))) return 0; }
  while(habitDone(hid,addDays(T,-i))){ n++; i++; if(i>400)break; }
  return n;
}

  var T=today();
  var hs=rows('habits').sort(function(a,b){return (a.sort_order||0)-(b.sort_order||0)});

  h+='<div class="card"><div class="card-t"><h3>今日打卡</h3><span class="muted">'+act.filter(function(x){return habitDone(x.id,T)}).length+' / '+act.length+'</span></div>';

  else{

        ${st>1?('<span class="hs">'+st+'天</span>'):''}

    h+=hs.map(function(hb){ return '<button class="btn sm gh" data-act="editHabit" data-id="'+hb.id+'">'+esc(hb.name)+' · 连续 '+streak(hb.id)+' 天</button>'; }).join('');
    h+='</div>';
  }
  h+='</div>';

  // 月度热力图
  var now=new Date(), y=now.getFullYear(), m=now.getMonth();

  }
  h+=`<div class="card"><div class="card-t"><h3>${m+1} 月热力图</h3><span class="muted">完成越多颜色越深</span></div>
    <div class="heat">${cells}</div>

    <span style="width:12px;height:12px;border-radius:3px;background:#F1EBE2"></span>

  // 30 天完成率曲线

function renderNews(){
  var all=state.db.news_items.slice().sort(function(a,b){ return (b.pub_date||b.created_at||'')<(a.pub_date||a.created_at||'')?-1:1; });
  if(!all.length && !state.newsFallbackTried){ state.newsFallbackTried=true; loadFallbackNews(); }
  var cat=state.ui.newsCat||'';
  var src=state.ui.newsSrc||'';
  var unread=state.ui.newsUnread?1:0;
  var srcs={}; all.forEach(function(r){ srcs[r.source]=(srcs[r.source]||0)+1; });
  var list=all.filter(function(r){
    if(cat && r.category!==cat) return false;
    if(src && r.source!==src) return false;
    if(unread && r.is_read) return false;
    return true;
  });
  var last=all.length?Math.max.apply(null,all.map(function(r){return new Date(r.created_at||0).getTime()})):0;
  var runs=(state.db.rss_runs||[]);
  var run=runs[0];
  var h=head('新闻资讯','共 '+all.length+' 条'+(last?(' · 更新于 '+ago(new Date(last).toISOString())):''),
    '<button class="btn gh sm" data-act="nav" data-v="settings">源管理</button>');
  if(run && run.fail_count>0){
    h+=`<div class="bar warn"><span>最近一次抓取：成功 ${run.ok_count} 个源，失败 ${run.fail_count} 个（已保留历史）</span></div>`;
  }
  h+=`<div class="card">
    <div class="seg" style="margin-bottom:10px">
      <button class="${cat===''?'on':''}" data-act="newsCat" data-c="">全部</button>
      <button class="${cat==='ai'?'on':''}" data-act="newsCat" data-c="ai">AI 应用</button>
      <button class="${cat==='psychology'?'on':''}" data-act="newsCat" data-c="psychology">心理学</button></div>
    <div class="row" style="gap:8px">
      <select id="newsSrc" style="flex:1" data-act2="newsSrc">
        <option value="">全部来源</option>
        ${Object.keys(srcs).sort().map(function(s){ return '<option value="'+esc(s)+'"'+(src===s?' selected':'')+'>'+esc(s)+' ('+srcs[s]+')</option>'; }).join('')}
      </select>
      <button class="chip${unread?' on':''}" data-act="newsUnread">仅未读</button></div>
    <div class="between" style="margin-top:10px"><span class="muted" style="font-size:12px">${list.length} 条 · ${all.filter(function(r){return !r.is_read}).length} 条未读</span>
      ${all.filter(function(r){return !r.is_read}).length?'<button class="btn sm gh" data-act="readAll">全部标记已读</button>':''}</div>
  </div>`;
  h+='<div class="card">';
  if(!list.length) h+=emptyBox('还没有资讯。RSS 每天 07:00 自动抓取，或去设置里手动触发','');
  else h+=list.slice(0,80).map(function(r){
    return `<div class="nitem${r.is_read?' read':''}">
      <div class="nt">${esc(r.title)}</div>
      ${r.summary?('<div class="muted" style="font-size:13px;margin-top:4px;line-height:1.55">'+esc(String(r.summary).slice(0,120))+'</div>'):''}
      <div class="between" style="margin-top:7px">
        <span class="row" style="gap:6px"><span class="pill ${r.category==='ai'?'ai':'psy'}">${esc(r.source)}</span>
        <span class="muted" style="font-size:11.5px">${ago(r.pub_date||r.created_at)}</span></span>
        <span class="row" style="gap:6px">
          <a class="btn sm gh" href="${esc(r.link)}" target="_blank" rel="noopener">阅读</a>
          <button class="btn sm gh" data-act="news2insp" data-id="${r.id}">存灵感</button>
          <button class="btn sm gh" data-act="toggleRead" data-id="${r.id}">${r.is_read?'未读':'已读'}</button></span></div></div>`;
  }).join('');
  h+='</div>';
  $('view').innerHTML=h;
  var s=$('newsSrc'); if(s) s.addEventListener('change',function(){ state.ui.newsSrc=s.value; renderNews(); });
}

/* ================= 自媒体数据 ================= */
function renderSocial(){
  var lines=rows('content_lines');
  var h=head('自媒体数据','小红书 · 曝光量 / 点赞量 / 评论量',
    '<button class="btn pri sm" data-act="addMetric">'+ic('plus')+'录入</button>');
  if(!lines.length){ $('view').innerHTML=h+'<div class="card">'+emptyBox('还没有内容线，先建一条','')+
    '<div style="text-align:center"><button class="btn pri" data-act="addLine">新增内容线</button></div></div>'; return; }
  var lid=state.ui.sline||lines[0].id;
  if(!lines.some(function(l){return l.id===lid})) lid=lines[0].id;
  state.ui.sline=lid;
  var range=state.ui.srange||14;
  var metric=state.ui.smetric||'impressions';
  var T=today();
  var all=rows('social_metrics').filter(function(m){return m.line_id===lid}).sort(function(a,b){return a.date<b.date?-1:1});
  var cur=all.filter(function(m){return m.date>addDays(T,-range)});
  var prev=all.filter(function(m){return m.date<=addDays(T,-range)&&m.date>addDays(T,-range*2)});
  function sum(arr,k){ return arr.reduce(function(a,b){return a+(Number(b[k])||0)},0); }
  var MN={impressions:'曝光量',likes:'点赞量',comments:'评论量'};
  var MC={impressions:'#E8836B',likes:'#7BA88F',comments:'#8A9BB8'};
  var vals=cur.map(function(m){return Number(m[metric])||0});
  var labels=cur.map(function(m){return cnDate(m.date)});
  var c=sum(cur,metric), p=sum(prev,metric);
  var delta=p?Math.round((c-p)/p*100):null;

  h+=`<div class="card"><div class="row wrap" style="gap:6px;margin-bottom:10px">`+
    lines.map(function(l){ return `<button class="chip${l.id===lid?' on':''}" data-act="sline" data-id="${l.id}">${esc(l.account_name)} · ${esc(l.field)}</button>`; }).join('')+
    `<button class="chip" data-act="addLine">${ic('plus')}</button>
     <button class="chip" data-act="editLine" data-id="${lid}">${ic('edit')}</button></div>
    <div class="seg">${[7,14,30,90].map(function(r){return '<button class="'+(range===r?'on':'')+'" data-act="srange" data-r="'+r+'">'+r+' 天</button>'}).join('')}</div></div>`;

  h+=`<div class="card"><div class="stat3">
    ${['impressions','likes','comments'].map(function(k){
      var cv=sum(cur,k), pv=sum(prev,k), d=pv?Math.round((cv-pv)/pv*100):null;
      return `<div><div class="v" style="color:${MC[k]}">${num(cv)}</div><div class="k">${MN[k]}</div>
        <div class="muted" style="font-size:11px;color:${d==null?'var(--sub)':(d>=0?'var(--red)':'var(--green)')}">${d==null?'—':(d>=0?'+':'')+d+'%'}</div></div>`;
    }).join('')}</div></div>`;

  h+=`<div class="card"><div class="card-t"><h3>${MN[metric]}趋势</h3>
    <span class="row" style="gap:5px">${Object.keys(MN).map(function(k){return '<button class="chip sm'+(metric===k?' on':'')+'" data-act="smetric" data-m="'+k+'">'+MN[k]+'</button>'}).join('')}</span></div>
    ${lineChart(vals,labels,MC[metric])}
    <div class="muted" style="margin-top:6px;font-size:12px">本周期合计 <b class="num">${num(c)}</b>${p?('，上一周期 <span class="num">'+num(p)+'</span>，环比 <b style="color:'+(delta>=0?'var(--red)':'var(--green)')+'">'+(delta>=0?'+':'')+delta+'%</b>'):''}</div></div>`;

  h+=`<div class="card"><div class="card-t"><h3>数据明细</h3><button class="btn sm gh" data-act="csv" data-c="social">${ic('down')}CSV</button></div><div class="tblwrap"><table>
    <thead><tr><th>日期</th><th>曝光量</th><th>点赞量</th><th>评论量</th><th></th></tr></thead><tbody>`;
  if(!cur.length) h+='<tr><td colspan="5" class="muted" style="text-align:center;padding:20px">该时间范围内暂无数据</td></tr>';
  else h+=cur.slice().reverse().map(function(m){
    return `<tr><td data-l="日期">${cnDate(m.date)}</td><td data-l="曝光">${num(m.impressions)}</td><td data-l="点赞">${num(m.likes)}</td><td data-l="评论">${num(m.comments)}</td>
      <td><span class="row" style="gap:4px;justify-content:flex-end">
      <button class="btn sm gh" data-act="editMetric" data-id="${m.id}">${ic('edit')}</button>
      <button class="btn sm gh danger" data-act="delRow" data-t="social_metrics" data-id="${m.id}">${ic('trash')}</button></span></td></tr>`;
  }).join('');
  h+='</tbody></table></div>'+(cur[0]&&cur[0].note?('<div class="muted" style="margin-top:8px">备注：'+esc(cur[0].note)+'</div>'):'')+'</div>';
  $('view').innerHTML=h;
}

/* ================= 小红书素材库 ================= */
function renderXhs(){
  var q=(state.ui.xhsQ||'').trim().toLowerCase();
  var tag=state.ui.xhsTag||'';
  var all=rows('xhs_notes');
  var tags={}; all.forEach(function(r){ (r.tags||[]).forEach(function(t){tags[t]=(tags[t]||0)+1}) });
  var list=all.filter(function(r){
    if(tag&&(r.tags||[]).indexOf(tag)<0) return false;
    if(q&&(String(r.title)+String(r.remark)+(r.tags||[]).join('')).toLowerCase().indexOf(q)<0) return false;
    return true;
  });
  var h=head('小红书素材库',all.length+' 条 · 支持搜索与标签筛选',
    '<button class="btn pri sm" data-act="addNote">'+ic('plus')+'新增</button>');
  h+=`<div class="card"><input type="text" id="xhsQ" placeholder="搜索标题 / 备注 / 标签…" value="${esc(state.ui.xhsQ||'')}">
    <div class="row wrap" style="margin-top:10px;gap:6px">
      <button class="chip sm${tag?'':' on'}" data-act="xhsTag" data-t="">全部</button>`+
      Object.keys(tags).map(function(t){return `<button class="chip sm${tag===t?' on':''}" data-act="xhsTag" data-t="${esc(t)}">${esc(t)}</button>`}).join('')+'</div></div>';
  h+='<div class="entries" style="margin-bottom:14px">';
  if(!list.length) h+='</div><div class="card">'+emptyBox('还没有素材，添加第一条','')+'</div>';
  else{
    h+=list.map(function(r){
      return `<div class="icard" style="margin:0">
        ${r.cover_url?('<img src="'+esc(r.cover_url)+'" alt="" style="margin-top:0">'):'<div style="height:78px;border-radius:10px;background:linear-gradient(135deg,#F7EFE6,#F1E7DC);display:flex;align-items:center;justify-content:center">'+ic('img')+'</div>'}
        <div class="ct" style="font-size:14px;margin-top:8px">${esc(r.title)}</div>
        <div class="row" style="gap:6px"><span class="pill">${esc(r.note_type||'未分类')}</span><span class="muted" style="font-size:11.5px">赞 ${num(r.likes)}</span></div>
        <div class="tags">${(r.tags||[]).map(function(t){return '<span class="tag">#'+esc(t)+'</span>'}).join('')}</div>
        ${r.remark?('<div class="muted" style="font-size:12px;margin-top:6px;line-height:1.5">'+nl(r.remark)+'</div>'):''}
        <div class="row" style="gap:6px;margin-top:8px;flex-wrap:wrap">
          <button class="btn sm gh" data-act="copyNote" data-id="${r.id}">复制文案</button>
          ${r.link?('<a class="btn sm gh" href="'+esc(r.link)+'" target="_blank" rel="noopener">原文</a>'):''}
          <button class="btn sm gh" data-act="editNote" data-id="${r.id}">${ic('edit')}</button>
          <button class="btn sm gh danger" data-act="delRow" data-t="xhs_notes" data-id="${r.id}">${ic('trash')}</button></div></div>`;
    }).join('')+'</div>';
  }
  $('view').innerHTML=h;
  bindSearch('xhsQ','xhsQ');
}

/* ================= 读书卡片 ================= */
var BOOK_CATS=['世界名著','心理学','个人成长','藏地藏语'];
function quoteHTML(q){
  // 藏语卡片格式：藏文 / 音译 / 中文
  if(String(q).indexOf(' / ')>=0){
    return q.split(' / ').map(function(p,i){
      return '<div style="font-size:'+(i===0?'18px':'14px')+';line-height:1.7;'+(i===0?'color:var(--text)':'color:var(--sub)')+'">'+esc(p.trim())+'</div>';
    }).join('');
  }
  return '<div style="font-size:15px;line-height:1.85">'+esc(q)+'</div>';
}
function dailyQuote(){
  var qs=rows('book_quotes'); if(!qs.length) return null;
  var s=0; for(var i=0;i<today().length;i++) s+=today().charCodeAt(i);
  return qs[s%qs.length];
}
function renderBooks(){
  var cat=state.ui.bookCat||'', bid=state.ui.bookId||'';
  var q=(state.ui.bookQ||'').trim().toLowerCase();
  var books=rows('books').slice().sort(function(a,b){return (a.sort_order||0)-(b.sort_order||0)});
  var quotes=rows('book_quotes');
  function bookOf(id){ for(var i=0;i<books.length;i++) if(books[i].id===id) return books[i]; return null; }

  var h=head('读书卡片',books.length+' 本书 · '+quotes.length+' 条摘录',
    bid?'<button class="btn gh sm" data-act="bookBack">'+ic('back')+'全部书籍</button>'
       :'<button class="btn pri sm" data-act="addBook">'+ic('plus')+'加书</button>');

  h+=`<div class="card"><input type="text" id="bookQ" placeholder="搜摘录内容或书名…" value="${esc(state.ui.bookQ||'')}"></div>`;

  if(q){
    var hits=quotes.filter(function(x){
      var b=bookOf(x.book_id)||{title:''};
      return (String(x.quote)+String(x.note||'')+b.title).toLowerCase().indexOf(q)>=0;
    });
    h+=`<div class="card"><div class="card-t"><h3>搜索结果</h3><span class="muted">${hits.length} 条</span></div>`;
    if(!hits.length) h+=emptyBox('没找到相关摘录','');
    else h+=hits.slice(0,40).map(function(x){ return quoteCard(x,bookOf(x.book_id)); }).join('');
    h+='</div>';
  } else if(bid){
    var b=bookOf(bid); if(!b){ state.ui.bookId=''; return renderBooks(); }
    var qs=quotes.filter(function(x){return x.book_id===bid});
    h+=`<div class="card"><div class="between">
      <div class="grow"><div style="font-size:18px;font-weight:600">${esc(b.title)}</div>
      <div class="muted" style="font-size:12.5px;margin-top:2px">${esc(b.author||'')} · <span class="pill">${esc(b.category)}</span></div>
      <div class="muted" style="font-size:13px;line-height:1.7;margin-top:8px">${esc(b.intro||'')}</div></div>
      <button class="btn sm ${b.is_read?'pri':'gh'}" data-act="readBook" data-id="${b.id}">${b.is_read?'读过':'标记读过'}</button></div>
      <div class="between" style="margin-top:12px"><span class="muted" style="font-size:12px">${qs.length} 条摘录</span>
      <button class="btn sm gh" data-act="addQuote" data-id="${b.id}">${ic('plus')}加摘录</button></div></div>`;
    h+='<div class="card">'+qs.map(function(x){ return quoteCard(x,b); }).join('')+'</div>';
  } else {
    h+=`<div class="card"><div class="seg" style="width:100%">
      <button class="${cat===''?'on':''}" data-act="bookCat" data-c="">全部</button>`+
      BOOK_CATS.map(function(c){return `<button class="${cat===c?'on':''}" data-act="bookCat" data-c="${c}">${c.slice(0,2)}</button>`}).join('')+
      `</div></div>`;
    var list=cat?books.filter(function(x){return x.category===cat}):books;
    h+='<div class="entries">';
    if(!list.length) h+='</div><div class="card">'+emptyBox('这个方向还没有书','')+'</div>';
    else{
      h+=list.map(function(x){
        var n=quotes.filter(function(y){return y.book_id===x.id}).length;
        return `<button class="entry" data-act="bookOpen" data-id="${x.id}" style="align-items:flex-start">
          <span class="ei" style="width:30px;height:30px">${ic('read')}</span>
          <span class="en" style="font-size:14px">${esc(x.title)}</span>
          <span class="ed">${esc(x.author||'')} · ${n} 条${x.is_read?' · 已读':''}</span></button>`;
      }).join('')+'</div>';
      h+=`<div class="card"><div class="muted" style="font-size:12.5px;line-height:1.7">
        点进书里看摘录，长按需收藏。想在通勤时随手翻，首页每天会换一张「今日书摘」。<br>
        微信读书没有开放接口，无法自动同步你的书架；这里是你自己的摘录库，随时可以手动加书加句。</div></div>`;
    }
  }
  $('view').innerHTML=h;
  bindSearch('bookQ','bookQ');
}
function quoteCard(x,b){
  return `<div class="icard" style="margin-bottom:9px">
    ${quoteHTML(x.quote)}
    <div class="between" style="margin-top:8px">
      <span class="row" style="gap:6px"><span class="pill">${esc(b?b.title:'')}</span>${x.chapter?('<span class="muted" style="font-size:11px">'+esc(x.chapter)+'</span>'):''}</span>
      <button class="btn sm gh" data-act="favQuote" data-id="${x.id}" style="${x.is_fav?'color:var(--accent)':''}">${x.is_fav?'★ 已收藏':'☆ 收藏'}</button></div>
    ${x.note?('<div class="muted" style="font-size:12.5px;line-height:1.7;margin-top:8px;padding:8px 10px;background:#FBF8F3;border-radius:9px">'+esc(x.note)+'</div>'):''}
  </div>`;
}

  else h+=bs.map(function(b){
    return `<div class="icard" style="margin-bottom:8px">
      <div class="between"><b style="font-size:14.5px">${esc(b.bean||'未命名')}</b>

      <div class="row wrap" style="gap:6px;margin-top:6px">
        <span class="pill">${esc(b.method||'—')}</span><span class="pill">${esc(b.ratio||'—')}</span><span class="pill">${esc(b.temp||'—')}</span>

        <button class="btn sm gh danger" data-act="delRow" data-t="coffee_brews" data-id="${b.id}">${ic('trash')}</button></div></div>`;
  }).join('');
  h+='</div>';
  $('view').innerHTML=h;
}

/* ================= 猫咪养护 ================= */
var CAT_KNOW=[
 {t:'疫苗',c:'幼猫 8/12/16 周各一针猫三联，之后每年加强一针；狂犬疫苗 3 月龄后接种，按当地规定每年或每三年一次。'},
 {t:'驱虫',c:'体内驱虫：成年猫每 3 个月一次（散养或吃生骨肉可缩短到 1 个月）。体外驱虫：春夏秋每月一次，冬季可 2–3 个月一次。'},
 {t:'体重',c:'成年家猫常规 3.5–5.5kg。每月固定时间称重，短期波动超过 10% 需关注；持续下降优先排查口腔与肾脏问题。'},
 {t:'饮水',c:'猫天生口渴感弱，建议湿粮 + 流动饮水机，每日饮水量约 40–60ml/kg。'},
 {t:'就医信号',c:'24 小时不进食、反复呕吐、排尿困难/无尿、呼吸急促、精神萎靡，这几种情况不要等，立刻就医。'}
];
function dueReminders(){
  var T=today();
  return rows('cat_records').filter(function(r){ return r.next_due && diffD(T,r.next_due)<=30; })
    .sort(function(a,b){return a.next_due<b.next_due?-1:1});
}
function renderCat(){
  var cats=rows('cats');
  var h=head('猫咪养护手册','共 '+cats.length+' 只 · '+rows('cat_records').length+' 条记录',
    cats.length?'<button class="btn pri sm" data-act="addCatRec">'+ic('plus')+'记录</button>':'');
  if(!cats.length){
    $('view').innerHTML=h+'<div class="card">'+emptyBox('还没有猫咪档案，先建一个','')+
    '<div style="text-align:center"><button class="btn pri" data-act="addCat">新增猫咪档案</button></div></div>'; return;
  }
  var cid=state.ui.cat||cats[0].id;
  if(!cats.some(function(c){return c.id===cid})) cid=cats[0].id;
  var c=byId('cats',cid);
  var recs=rows('cat_records').filter(function(r){return r.cat_id===cid}).sort(function(a,b){return a.date<b.date?1:-1});
  var T=today();
  h+=`<div class="card"><div class="between">
    <div class="row" style="gap:12px">
      <div style="width:52px;height:52px;border-radius:16px;background:#F7EFE6;display:flex;align-items:center;justify-content:center;color:var(--accent)">${ic('cat')}</div>
      <div><div style="font-size:17px;font-weight:600">${esc(c.name)}</div>
      <div class="muted" style="font-size:12.5px">${esc(c.breed||'—')} · ${esc(c.gender||'—')} · ${c.birthday?cnDate(c.birthday)+' 出生':'生日未填'}</div></div></div>
    <button class="btn sm gh" data-act="editCat" data-id="${c.id}">${ic('edit')}</button></div>
    ${cats.length>1?('<div class="row wrap" style="gap:6px;margin-top:10px">'+cats.map(function(x){return '<button class="chip sm'+(x.id===cid?' on':'')+'" data-act="catPick" data-id="'+x.id+'">'+esc(x.name)+'</button>'}).join('')+'</div>'):''}
  </div>`;
  var due=dueReminders().filter(function(r){return r.cat_id===cid});
  if(due.length){
    h+=`<div class="card" style="border-color:#F0C9A8"><div class="card-t"><h3 style="color:#B07B36">到期提醒</h3></div>`+
      due.map(function(r){
        var dd=diffD(T,r.next_due);
        return `<div class="between" style="padding:6px 0;border-bottom:1px solid var(--line2)">
          <span>${esc(r.type)} · ${esc(r.value||'')}</span>
          <span class="pill" style="${dd<0?'background:#FBE6E0;color:#C0503C':'background:#FBEEDC;color:#B07B36'}">${dd<0?('已过期 '+Math.abs(dd)+' 天'):(dd===0?'今天':(dd+' 天后'))} · ${cnDate(r.next_due)}</span></div>`;
      }).join('')+'</div>';
  }
  h+=`<div class="card"><div class="card-t"><h3>养护记录</h3><span class="muted">${recs.length} 条</span></div>`;
  if(!recs.length) h+=emptyBox('还没有记录，添加第一条','');
  else h+=recs.map(function(r){
    var TC={'疫苗':'#E8EDF5','驱虫':'#EFE9F3','体重':'#E9EFE6','就医':'#FBE6E0'};
    var FC={'疫苗':'#5C6E8C','驱虫':'#7A628C','体重':'#5F8568','就医':'#C0503C'};
    return `<div class="icard" style="margin-bottom:8px">
      <div class="between"><div class="row" style="gap:8px">
        <span class="pill" style="background:${TC[r.type]||'#F3EDE4'};color:${FC[r.type]||'#8A8078'}">${esc(r.type)}</span>
        <b style="font-size:14.5px">${esc(r.value||'')}</b></div>
        <span class="muted" style="font-size:12px">${cnDate(r.date)}</span></div>
      ${r.next_due?('<div class="muted" style="font-size:12px;margin-top:5px">下次到期：'+cnDate(r.next_due)+'</div>'):''}
      ${r.note?('<div class="muted" style="font-size:13px;margin-top:5px;line-height:1.6">'+nl(r.note)+'</div>'):''}
      <div class="row" style="gap:6px;margin-top:8px;justify-content:flex-end">
        <button class="btn sm gh" data-act="editCatRec" data-id="${r.id}">${ic('edit')}</button>
        <button class="btn sm gh danger" data-act="delRow" data-t="cat_records" data-id="${r.id}">${ic('trash')}</button></div></div>`;
  }).join('');
  h+='</div>';
  h+=`<div class="card"><div class="card-t"><h3>通用养护知识</h3></div>`+
    CAT_KNOW.map(function(k,i){
      var open=state.ui['ck'+i];
      return `<div style="border-bottom:1px solid var(--line2);padding:9px 0">
        <button class="between" style="width:100%" data-act="ckToggle" data-i="${i}">
          <span style="font-size:14.5px">${esc(k.t)}</span><span class="muted">${open?'−':'+'}</span></button>
        ${open?('<div class="muted" style="font-size:13.5px;line-height:1.75;margin-top:6px">'+esc(k.c)+'</div>'):''}</div>`;
    }).join('')+'</div>';
  $('view').innerHTML=h;
}

/* ================= 设置 ================= */
function renderSettings(){
  var h=head('设置','云端同步 / 数据备份 / 源管理');
  h+=`<div class="card"><div class="card-t"><h3>Supabase 云端同步</h3>
    <span class="muted">${sbReady()?(state.q.length?'待同步 '+state.q.length:'已连接'):'未连接'}</span></div>
    <div class="fg"><label class="f">Project URL</label><input type="text" id="cfgUrl" value="${esc(CFG.url)}"></div>
    <div class="fg"><label class="f">anon / publishable key</label><input type="password" id="cfgKey" value="${esc(CFG.key)}" placeholder="eyJhbGciOi..."></div>
    <div class="row" style="gap:8px">
      <button class="btn pri" data-act="saveCfg">保存并连接</button>
      <button class="btn gh" data-act="testCfg">测试连接</button>
      ${sbReady()?'<button class="btn gh" data-act="pullCfg">从云端拉取</button>':''}</div>
    <div class="muted" style="margin-top:10px;font-size:12px;line-height:1.7">
      填了 key 之后，电脑和手机打开同一个网址、各自填一次 key，数据就实时同步了（另一端新增后 3 秒内可见）。<br>
      anon key 存本机 localStorage，不会上传；Supabase 侧已开启 RLS。</div></div>`;

  h+=`<div class="card"><div class="card-t"><h3>进入口令</h3></div>
    <div class="fg"><label class="f">新口令（留空表示不修改）</label><input type="password" id="pwNew" placeholder="建议 6 位以上"></div>
    <button class="btn pri" data-act="savePw">修改口令</button>
    <div class="muted" style="margin-top:8px;font-size:12px">口令只防误入，不等于加密。默认 lifehub2026，建议改掉。</div></div>`;

  h+=`<div class="card"><div class="card-t"><h3>数据备份</h3></div>
    <div class="row wrap" style="gap:8px">
      <button class="btn gh" data-act="exportJson">导出 JSON 全量备份</button>
      <button class="btn gh" data-act="importJson">导入 JSON 恢复</button>
      <button class="btn gh" data-act="csv" data-c="tasks">任务 CSV</button>
      <button class="btn gh" data-act="csv" data-c="inspirations">灵感 CSV</button>
      <button class="btn gh" data-act="csv" data-c="social">自媒体 CSV</button>
      <button class="btn gh" data-act="csv" data-c="xhs">素材 CSV</button>
    </div></div>`;

  h+=`<div class="card"><div class="card-t"><h3>最近删除（30 天内可恢复）</h3></div>`;
  var dels=[];
  Object.keys(TABLES).forEach(function(t){ if(!TABLES[t].del) return;
    state.db[t].filter(function(r){return r.deleted_at}).forEach(function(r){ dels.push({t:t,r:r}); }); });
  if(!dels.length) h+='<div class="muted" style="font-size:13px">没有已删除的内容</div>';
  else h+=dels.slice(0,20).map(function(d){
    var title=d.r.title||d.r.content||'(无标题)';
    return `<div class="between" style="padding:7px 0;border-bottom:1px solid var(--line2)">
      <span class="grow" style="font-size:13.5px">${esc(String(title).slice(0,26))}<span class="muted" style="font-size:11px"> · ${esc(d.t)}</span></span>
      <button class="btn sm gh" data-act="restore" data-t="${d.t}" data-id="${d.r.id}">恢复</button></div>`;
  }).join('');
  h+='</div>';

  h+=`<div class="card"><div class="card-t"><h3>新闻源管理</h3><span class="muted">${(state.db.rss_sources||[]).length||DEFAULT_SRC.length} 个源</span></div>
    <div class="muted" style="font-size:12.5px;line-height:1.7;margin-bottom:10px">
      GitHub Actions 每天 07:00 抓取。默认 ${DEFAULT_SRC.length} 个已实测源在仓库 <code>scripts/sources.json</code>；这里增删的自定义源存在本机，若要定时任务也抓取，需同步更新仓库文件。</div>`;
  var srcs=(state.db.rss_sources&&state.db.rss_sources.length)?state.db.rss_sources:DEFAULT_SRC.map(function(s,i){return {id:'d'+i,name:s.name,url:s.url,category:s.category,limit_n:s.limit||0,is_active:true}});
  h+=srcs.map(function(s){
    return `<div class="between" style="padding:7px 0;border-bottom:1px solid var(--line2)">
      <span class="grow"><span class="pill ${s.category==='ai'?'ai':'psy'}">${s.category==='ai'?'AI':'心理'}</span> ${esc(s.name)}</span>
      <span class="muted" style="font-size:11px;max-width:38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(s.url)}</span></div>`;
  }).join('');
  h+='<div style="margin-top:10px"><button class="btn sm gh" data-act="addSrc">'+ic('plus')+'新增源</button></div></div>';

  h+=`<div class="card"><div class="card-t"><h3>其他</h3></div>
    <div class="row wrap" style="gap:8px">
      <button class="btn gh" data-act="clearDemo">清空演示数据</button>
      <button class="btn gh danger" data-act="clearAll">清空本机全部数据</button></div>
    <div class="muted" style="margin-top:10px;font-size:12px;line-height:1.7">
      单文件应用 · GitHub Pages 静态部署 · Supabase 云同步<br>
      手机端：浏览器菜单 → 添加到主屏幕，即可当 App 用。</div></div>`;
  $('view').innerHTML=h;
}

  var h='<div class="sheet-mask" data-act="close"></div><div class="sheet"><h3>更多</h3><div class="entries">'+
    items.map(function(n){ return '<button class="entry" data-act="nav" data-v="'+n.v+'"><span class="ei">'+ic(n.i)+'</span><span class="en">'+n.n+'</span></button>'; }).join('')+
    '</div></div>';
  $('modalRoot').innerHTML=h;
}
function quickadd(){
  var h='<div class="sheet-mask" data-act="close"></div><div class="sheet"><h3>快速新增</h3><div class="entries">'+
   [['addTask','新增任务','tasks'],['addInsp','记一条灵感','bulb'],['addNote','存素材','img'],['addBrew','冲煮记录','coffee'],['addMetric','录数据','chart'],['addCatRec','猫咪记录','cat']]
   .map(function(x){ return '<button class="entry" data-act="'+x[0]+'"><span class="ei">'+ic(x[2])+'</span><span class="en">'+x[1]+'</span></button>'; }).join('')+
   '</div></div>';
  $('modalRoot').innerHTML=h;
}
function bindSearch(id,key){
  var el=$(id); if(!el) return;
  el.addEventListener('input',function(){
    state.ui[key]=el.value;
    var pos=el.selectionStart;
    if(key==='inspQ') renderInspirations(); else renderXhs();
    var e2=$(id); if(e2){ e2.focus(); try{e2.setSelectionRange(pos,pos)}catch(err){} }
  });
}

function fg(label,inner){ return '<div class="fg"><label class="f">'+label+'</label>'+inner+'</div>'; }
function sel(id,opts,cur){
  return '<select id="'+id+'">'+opts.map(function(o){
    return '<option value="'+esc(o[0])+'"'+(String(cur)===String(o[0])?' selected':'')+'>'+esc(o[1])+'</option>'; }).join('')+'</select>';
}

/* ================= 事件委托 ================= */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]'); if(!t) return;
  var a=t.dataset.act, id=t.dataset.id;
  if(a==='maskclose'&&e.target!==t) return;
  switch(a){
    case 'nav': closeModal(); go(t.dataset.v); break;
    case 'close': closeModal(); break;
    case 'quickadd': quickadd(); break;
    case 'retry': flush(); break;
    case 'confirmYes': { var cb=state.confirmCb; state.confirmCb=null; closeModal(); if(cb) cb(); break; }
    /* 任务 */
    case 'addTask': closeModal(); formTask(); break;
    case 'editTask': formTask(byId('tasks',id)); break;
    case 'saveTask': {
      var ti=v('fTitle'); if(!ti){ toast('标题不能为空','err'); return; }
      var d={title:ti,priority:v('fPri'),due_date:v('fDue')||null};
      if(id) updRow('tasks',id,d); else { d.status='pending'; d.done_at=null; d.created_at=new Date().toISOString(); addRow('tasks',d); }
      closeModal(); refreshAll(); toast(id?'已更新':'已添加','ok'); break;
    }
    case 'toggleTask': {
      var tk=byId('tasks',id); if(!tk) break;
      var done=tk.status!=='done';
      updRow('tasks',id,{status:done?'done':'pending',done_at:done?new Date().toISOString():null});
      refreshAll(); if(done) toast('完成一项','ok'); break;
    }
    case 'allToday': {
      var od=overdueList(); if(!od.length){ toast('没有逾期任务'); break; }
      confirmBox('全部改到今天','把 '+od.length+' 项逾期任务的截止日统一改为今天？',function(){
        od.forEach(function(x){ updRow('tasks',x.id,{due_date:today()}); });
        refreshAll(); toast('已改期 '+od.length+' 项','ok');
      },'确认改期'); break;
    }
    /* 习惯 */
    case 'addHabit': closeModal(); formHabit(); break;
    case 'editHabit': formHabit(byId('habits',id)); break;
    case 'pickIcon': { $('fIcon').value=t.dataset.i;
      t.parentNode.querySelectorAll('.chip').forEach(function(c){c.classList.remove('on')}); t.classList.add('on'); break; }
    case 'pickColor': { $('fColor').value=t.dataset.c;
      t.parentNode.querySelectorAll('button').forEach(function(c){ c.style.border='2px solid transparent'; });
      t.style.border='3px solid #3D3730'; break; }
    case 'saveHabit': {
      var hn=v('fName'); if(!hn){ toast('名称不能为空','err'); return; }
      var hd={name:hn,icon:v('fIcon'),color:v('fColor'),is_active:v('fActive')==='1'};
      if(id) updRow('habits',id,hd); else { hd.sort_order=(rows('habits').length+1); addRow('habits',hd); }
      closeModal(); refreshAll(); toast('已保存','ok'); break;
    }
    case 'toggleHabit': {
      var d0=today();
      var lg=null; for(var i=0;i<state.db.habit_logs.length;i++){ var l=state.db.habit_logs[i]; if(l.habit_id===id&&l.date===d0){lg=l;break;} }
      if(lg) delRow('habit_logs',lg.id); else addRow('habit_logs',{habit_id:id,date:d0});
      refreshAll(); break;
    }
    /* 灵感 */
    case 'addInsp': closeModal(); formInsp(); break;
    case 'editInsp': formInsp(byId('inspirations',id)); break;
    case 'saveInsp': {
      var c0=v('fContent'); if(!c0){ toast('内容不能为空','err'); return; }
      var dd={content:c0,image_url:v('fImg'),tags:tags(v('fTags'))};
      if(id) updRow('inspirations',id,dd); else { dd.created_at=new Date().toISOString(); addRow('inspirations',dd); }
      closeModal(); refreshAll(); toast('已保存','ok'); break;
    }
    case 'inspTag': state.ui.inspTag=t.dataset.t; renderInspirations(); break;
    /* 新闻 */
    case 'newsCat': state.ui.newsCat=t.dataset.c; renderNews(); break;
    case 'newsUnread': state.ui.newsUnread=!state.ui.newsUnread; renderNews(); break;
    case 'toggleRead': { var n=byId('news_items',id); if(n){ updRow('news_items',id,{is_read:!n.is_read}); renderNews(); } break; }
    case 'readAll': {
      confirmBox('全部标记已读','把所有资讯标记为已读？',function(){
        state.db.news_items.forEach(function(x){ if(!x.is_read) updRow('news_items',x.id,{is_read:true}); });
        refreshAll(); toast('已标记','ok');
      },'确认'); break;
    }

      toast('已存入灵感','ok'); break;

      closeModal(); refreshAll(); toast('已保存','ok'); break;

      if(id) updRow('social_metrics',id,md); else { md.created_at=new Date().toISOString(); addRow('social_metrics',md); }
      closeModal(); refreshAll(); toast('已保存','ok'); break;
    }
    /* 素材 */

      if(id) updRow('xhs_notes',id,nd); else { nd.created_at=new Date().toISOString(); addRow('xhs_notes',nd); }

      var txt=nr.title+'\n'+(nr.remark||'')+'\n'+((nr.tags||[]).map(function(x){return '#'+x}).join(' '));
      if(navigator.clipboard) navigator.clipboard.writeText(txt).then(function(){toast('已复制','ok')},function(){toast('复制失败','err')});
      else toast('当前环境不支持复制','err');
      break;
    }

    case 'coffeeLv': state.ui.coffeeLv=t.dataset.l; renderCoffee(); break;
    case 'clToggle': state.ui['cl'+id]=!state.ui['cl'+id]; renderCoffee(); break;
    case 'learn': { var cl2=byId('coffee_lessons',id); if(cl2){ updRow('coffee_lessons',id,{is_learned:!cl2.is_learned}); renderCoffee(); } break; }
    case 'addLesson': closeModal(); formLesson(); break;
    case 'editLesson': formLesson(byId('coffee_lessons',id)); break;
    case 'saveLesson': {
      var lt=v('fTitle'); if(!lt){ toast('标题不能为空','err'); return; }

    }
    case 'addBrew': closeModal(); formBrew(); break;
    case 'editBrew': formBrew(byId('coffee_brews',id)); break;
    case 'saveBrew': {
      var bd={bean:v('fBean'),method:v('fMethod'),ratio:v('fRatio'),temp:v('fTemp'),rating:Number(v('fRating'))||4,note:v('fNote'),date:v('fDate')};
      if(id) updRow('coffee_brews',id,bd); else { bd.created_at=new Date().toISOString(); addRow('coffee_brews',bd); }
      closeModal(); refreshAll(); toast('已保存','ok'); break;
    }
    /* 读书卡片 */
    case 'bookCat': state.ui.bookCat=t.dataset.c; state.ui.bookId=''; renderBooks(); break;
    case 'bookOpen': state.ui.bookId=id; window.scrollTo(0,0); renderBooks(); break;
    case 'bookBack': state.ui.bookId=''; renderBooks(); break;
    case 'favQuote': { var qq=byId('book_quotes',id); if(qq){ updRow('book_quotes',id,{is_fav:!qq.is_fav}); renderBooks(); } break; }
    case 'readBook': { var bb=byId('books',id); if(bb){ updRow('books',id,{is_read:!bb.is_read}); renderBooks(); } break; }

    case 'delRow': {
      var tb=t.dataset.t, row=byId(tb,id);

    }
    case 'clearAll': {
      confirmBox('清空全部本机数据','这会清空本机所有数据与待同步队列，且无法在本机找回（云端数据仍保留）。确定？',function(){
        localStorage.removeItem(K.db); localStorage.removeItem(K.q);
        Object.keys(TABLES).forEach(function(tb){ state.db[tb]=[]; }); state.q=[];
        saveLocal(); refreshAll(); toast('已清空','ok');
      },'确认清空'); break;
    }
  }
});

/* ---------- 移动端输入框防键盘遮挡 ---------- */
document.addEventListener('focusin',function(e){
  var el=e.target;
  if(el && /INPUT|TEXTAREA|SELECT/.test(el.tagName) && window.innerWidth<768){
    setTimeout(function(){ try{ el.scrollIntoView({block:'center',behavior:'smooth'}); }catch(err){} },320);
  }
});

/* ---------- 刷新调度（唯一入口，渲染函数之间禁止互调） ---------- */
function refreshAll(){
  renderNav();
  renderBars();
  var v=state.view, f={
    home:renderHome, tasks:renderTasks, habits:renderHabits, inspirations:renderInspirations,
    books:renderBooks, news:renderNews, social:renderSocial, xhs:renderXhs, coffee:renderCoffee,
    cat:renderCat, settings:renderSettings
  };
  (f[v]||renderHome)();
}

/* ---------- 启动 ---------- */
function boot(){
  var saved=LS.get(K.view,'home'); if(NAV.some(function(n){return n.v===saved})) state.view=saved;
  var local=LS.get(K.db,null);
  if(local){ Object.keys(local).forEach(function(t){ if(state.db[t]!==undefined) state.db[t]=local[t]||[]; }); }
  state.q=LS.get(K.q,[]);
  // 无云端配置且本地无数据 → 演示数据
  var empty=!local || !local.tasks || !local.tasks.length;
  if((!sbReady() || empty) && !local){ seedDemo(); state.demo=(!sbReady()); }
  refreshAll();
  var snap = state.demoSeeded ? JSON.parse(JSON.stringify(state.db)) : null;
  if(sbReady()){
    loadAll().then(function(){
      var total=0; Object.keys(state.db).forEach(function(t){ total+=(state.db[t]||[]).length; });
      if(snap && total===0){ state.db=snap; state.demo=true; saveLocal(); }
      refreshAll(); flush();
    }).catch(function(e){
      toast('云端读取失败，已切换本机数据','err'); refreshAll();
    });
  } else { renderBars(); }
  setInterval(function(){ if(state.q.length && sbReady()) flush(); },30000);
}
window.addEventListener('online',function(){ state.online=true; flush(); refreshAll(); });
window.addEventListener('offline',function(){ state.online=false; refreshAll(); });
document.addEventListener('DOMContentLoaded',function(){
  var gi=$('gateIn');
  if(gi){ gi.addEventListener('keydown',function(e){ if(e.key==='Enter') gateCheck(); }); }
});
</script>
